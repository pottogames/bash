name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    name: Engine — typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. `packageManager` in package.json already
      # pins pnpm, and specifying both makes the action refuse to run rather
      # than pick one.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  database:
    name: Database — migrations and RLS
    runs-on: ubuntu-latest

    # The RLS suite is the one that must never be skipped. It runs against a
    # real Postgres because the policies are the security boundary, and a
    # boundary that is only checked by the application is not a boundary.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run RLS tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: plan2quote_test
        run: ./scripts/test-db.sh

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. `packageManager` in package.json already
      # pins pnpm, and specifying both makes the action refuse to run rather
      # than pick one.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine packages resolve to their `dist` types when Next typechecks,
      # so they have to exist before the app is built.
      - run: pnpm build
      - run: pnpm --filter @plan2quote/web build
